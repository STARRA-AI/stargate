# Dependabot — free on private repos. Opens grouped update PRs so vulnerable /
# stale deps don't rot. Security updates are separate + immediate (see the repo's
# "Automated security fixes" setting, enabled alongside this).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"

  # Keep the GitHub Actions used by the workflows below patched (supply-chain).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
