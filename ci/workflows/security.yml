name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly sweep catches newly-disclosed vulns in unchanged deps.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency vulnerabilities. Fails the check on High/Critical so a vulnerable
  # dep can't merge; moderates surface via Dependabot without blocking.
  audit:
    name: npm audit (dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit (fail on high or critical)
        run: npm audit --audit-level=high

  # Secret scanning over the FULL history. Free on private repos (native GitHub
  # secret scanning needs Advanced Security; the gitleaks binary does not).
  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(curl -sSfL -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep -oE '"tag_name": *"v[^"]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          echo "gitleaks v${VERSION}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan history for secrets
        run: gitleaks detect --redact --no-banner --exit-code 1

  # Static analysis (SAST). Informational for now — reports issues without
  # blocking merges, so false positives don't wedge the pipeline. Promote to a
  # required check once the ruleset is tuned.
  sast:
    name: semgrep (SAST, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/nextjs \
            --config p/secrets \
            --error --skip-unknown-extensions
